<div class="login">
  <div class="login-screen">
    <div class="app-title">
      <h1>Welcome</h1>
    </div>

    <div class="login-form">

      <div class="control-group">
        <input
          type="text"
          class="login-field"
          placeholder="username"
          [(ngModel)]="usuario">
      </div>

      <div class="control-group">
        <input
          type="password"
          class="login-field"
          placeholder="password"
          [(ngModel)]="password">
      </div>

      <button
        class="btn btn-primary btn-large btn-block"
        (click)="validar()">
        Login
      </button>

      <p>{{ mensaje }}</p>

    </div>
  </div>
</div>
